<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Full-Width Image</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Container for the images -->
    <div class="image-container">
        <img src="Hey Sharon.png" alt="Responsive Image">
        <img src="HEY S.png" alt="Responsive Image">
        <img src="popcorn.png" alt="Responsive Image">
    </div>
</body>
</html>

<style>
/* Reset some default browser styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

/* Container for the images */
.image-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
}

/* Responsive image */
.image-container img {
    width: 117%;
    height: 130%;
    object-fit: cover;
}
</style>
